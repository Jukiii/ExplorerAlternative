name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ジョブ名 `check` は、main のブランチ保護の必須ステータスチェック名と一致させる（NOLITOと共通）。
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ExplorerAlternative.slnx --configuration Release
      - run: dotnet test ExplorerAlternative.slnx --configuration Release --no-build
      # 依存の脆弱性チェック。既知の脆弱性のあるパッケージがあれば失敗させる。
      - name: audit
        shell: pwsh
        run: |
          $output = dotnet list ExplorerAlternative.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match 'has the following vulnerable packages') { throw '既知の脆弱性のあるパッケージがあります。' }
