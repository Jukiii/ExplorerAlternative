name: Release

# タグ（v1.3.3 など）をプッシュすると、テスト → 発行 → 起動確認 → zip化 → インストーラーの作成と確認 →
# GitHub Release の作成までを自動で行う。
# 手動実行（workflow_dispatch）では、既定でリリースは作らず（dry_run）、zipとインストーラーを
# Artifactとして残すだけにする（ワークフロー自体の確認用）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "リリースを作成せず、zipとインストーラーをArtifactに残すだけにする"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # タグのバージョンと、csprojの<Version>が一致していることを確認する
      # （exeのファイルバージョンが、配布するリリースと食い違わないようにする）。
      - name: バージョンの確認
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content ExplorerAlternative/ExplorerAlternative.csproj -Raw)
          $projectVersion = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $projectVersion) { throw 'csprojに<Version>がありません。' }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tagVersion -ne $projectVersion) {
              throw "タグ($env:GITHUB_REF_NAME)とcsprojのVersion($projectVersion)が一致しません。"
            }
          }

          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          Write-Host "バージョン: $projectVersion"

      - name: テスト
        run: dotnet test ExplorerAlternative.slnx --configuration Release

      - name: 発行（自己完結型・単一ファイル）
        run: >
          dotnet publish ExplorerAlternative/ExplorerAlternative.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      # 起動して、数秒後も終了していないことを確認する。終了するのは、自分が起動したプロセスだけ。
      - name: 起動確認
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'publish/ExplorerAlternative.exe'
          $version = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "exeのファイルバージョン: $version"
          if (-not $version.StartsWith('${{ steps.version.outputs.version }}')) {
            throw "exeのバージョン($version)がcsprojのVersionと一致しません。"
          }

          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "起動後に終了しました（終了コード: $($process.ExitCode)）。" }
            Write-Host "起動を確認しました（PID: $($process.Id)）。"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: zip化
        shell: pwsh
        run: |
          $name = "ExplorerAlternative-v${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/ExplorerAlternative.exe -DestinationPath $name
          "ZIP_NAME=$name" >> $env:GITHUB_ENV
          Get-Item $name | Select-Object Name, Length

      # インストーラー（Inno Setup。installer/ExplorerAlternative.iss）。作ったあと、実際に（現在のユーザー向けに、
      # 画面なしで）インストール → 起動 → アンインストールして、入ること・動くこと・消えることを確認する。
      - name: インストーラーの作成
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/ExplorerAlternative.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーを作れませんでした（終了コード: $LASTEXITCODE）。" }

          $setup = "installer/output/ExplorerAlternative-v${{ steps.version.outputs.version }}-Setup.exe"
          if (-not (Test-Path $setup)) { throw "インストーラーが見つかりません: $setup" }
          "SETUP_PATH=$setup" >> $env:GITHUB_ENV
          "SETUP_NAME=$(Split-Path $setup -Leaf)" >> $env:GITHUB_ENV
          Get-Item $setup | Select-Object Name, Length

      - name: インストーラーの確認（インストール・起動・アンインストール）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ea-install-test'
          $setup = (Resolve-Path $env:SETUP_PATH).Path

          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$dir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "インストールに失敗しました（終了コード: $($install.ExitCode)）。" }

          $exe = Join-Path $dir 'ExplorerAlternative.exe'
          $uninstaller = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path $exe)) { throw "インストール先にexeがありません: $exe" }
          if (-not (Test-Path $uninstaller)) { throw "アンインストーラーがありません: $uninstaller" }

          # 起動して、数秒後も終了していないことを確認する。終了するのは、自分が起動したプロセスだけ。
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "インストールしたアプリが、起動後に終了しました（終了コード: $($process.ExitCode)）。" }
            Write-Host "インストールしたアプリの起動を確認しました（PID: $($process.Id)）。"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "アンインストールに失敗しました（終了コード: $($uninstall.ExitCode)）。" }

          # アンインストーラーは、自分自身を少し遅れて削除するため、消えるのを少し待つ。
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw "アンインストール後も、exeが残っています: $exe" }
          Write-Host 'インストール・起動・アンインストールを確認しました。'

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerAlternative-v${{ steps.version.outputs.version }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_PATH }}

      # タグのプッシュのときだけ、リリースを作成する。リリースノートは docs/release-notes/v<バージョン>.md が
      # あればそれを使い、無ければGitHubの自動生成にする。
      - name: リリースの作成
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) {
            gh release create $env:GITHUB_REF_NAME $env:ZIP_NAME $env:SETUP_PATH --title $env:GITHUB_REF_NAME --notes-file $notes --verify-tag
          } else {
            gh release create $env:GITHUB_REF_NAME $env:ZIP_NAME $env:SETUP_PATH --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }
